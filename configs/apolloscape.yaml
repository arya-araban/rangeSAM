# ApolloScape, used as an unseen test set (cross-dataset evaluation of a KITTI-360 model)
id: 'apolloscape'
dataset: 'ApolloScape'

# Sequences of detection_train_bin
split:
  train: []
  valid: []
  test:
    - '9048_1'
    - '9048_3'
    - '9048_4'
    - '9049_3'
    - '9049_4'
    - '9050_2'
    - '9050_4'
    - '9051_5'
    - '9051_7'
    - '9051_9'
    - '9052_1'
    - '9052_3'
    - '9052_5'
    - '9052_9'
    - '9053_11'
    - '9053_14'
    - '9053_2'
    - '9053_4'
    - '9053_7'
    - '9054_10'
    - '9054_2'
    - '9054_5'
    - '9054_7'
    - '9054_9'
    - '9055_1'
    - '9055_10'
    - '9055_4'
    - '9055_6'
    - '9055_8'
    - '9056_1'
    - '9056_9'
    - '9057_5'
    - '9057_6'
    - '9057_9'
    - '9058_5'
    - '9058_6'
    - '9059_1'
    - '9059_6'
    - '9059_8'
    - '9060_2'
    - '9060_6'
    - '9060_9'
    - '9061_1'
    - '9061_7'
    - '9061_8'
    - '9062_3'
    - '9062_8'
    - '9063_11'
    - '9063_13'
    - '9063_3'
    - '9063_5'
    - '9063_6'
    - '9063_7'

# Training
n_classes: 2                # foreground + background
n_epochs: 200
warmup_epochs: 10
batch_size: 8
lr: 0.0004
weight_decay: 0.01
grad_clipping: 4
val_frequency: 1
num_fg_points: [1, 12]      # foreground clicks sampled per training example
num_bg_points: [0, 8]       # background clicks sampled per training example

# Loss weights
focal_weight: 20.0
dice_weight: 1.0
prompt_weight: 0.3

# Model
vit_backbone: 'vit_small_patch16_384'   # ViT-S/16 encoder
in_channels: 5                          # range, x, y, z, intensity
patch_size: [2, 8]
patch_stride: [2, 8]
image_size: [64, 384]                   # range image crop (H, W) around the selected instance
conv_stem: 'ConvStem'
stem_base_channels: 32
D_h: 128                                # hidden dim of the stem and decoder
skip_filters: 128                       # skip connection stem -> decoder (0 or D_h)
reuse_pos_emb: true                     # reuse the positional embeddings of the pre-trained ViT

# Prompt encoder and two-way transformer
prompt_embed_dim: 128
transformer_depth: 3
num_heads: 8
mlp_dim: 2048

# RangeSAM components (set to false for ablations)
label_enforcement: true
learnable_prompt_scale: true
use_prompt_loss: true

# Point cloud augmentation (training only)
augmentation:
  p_flipx: 0.
  p_flipy: 0.5
  p_transx: 0.5
  trans_xmin: -5
  trans_xmax: 5
  p_transy: 0.5
  trans_ymin: -3
  trans_ymax: 3
  p_transz: 0.5
  trans_zmin: -1
  trans_zmax: 0.
  p_rot_roll: 0.5
  rot_rollmin: -5
  rot_rollmax: 5
  p_rot_pitch: 0.5
  rot_pitchmin: -5
  rot_pitchmax: 5
  p_rot_yaw: 0.5
  rot_yawmin: -5
  rot_yawmax: 5

# Range projection (64 x 2048)
sensor:
  scan_proj: false       # true: rows from the laser ring order, false: from the vertical angle
  proj_h: 64
  proj_w: 2048
  fov_up: 2.0
  fov_down: -24.8
  fov_left: -180
  fov_right: 180
  img_mean: [12.12, 10.88, 0.23, -1.04, 0.21]
  img_stds: [12.32, 11.47, 6.91, 0.86, 0.16]
